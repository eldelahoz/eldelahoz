name: Update GitHub Activity
on:
  schedule: # Runs daily
    - cron: "0 2 * * *"
  workflow_dispatch: # Manual trigger
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout
        uses: actions/checkout@v3

      # Step 2: Run GitHub activity fetcher
      - name: Update GitHub Activity
        uses: Raymo111/github-activity-readme@v1
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Use Personal Access Token
          
      # Step 3: Commit and push changes
      - name: Commit changes
        run: |
          git config --local user.email "actions@GitHub.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "Update: Latest GitHub activity"
          git push